<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony J Games | Unblocked</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Tony J Games</div>
    </header>

    <main>
        <!-- The library where games are displayed -->
        <div id="game-library" class="grid"></div>

        <!-- The player view when a game is active -->
        <div id="game-player" class="hidden">
            <div class="player-controls">
                <button id="close-btn">✖ Close Game</button>
                <h2 id="current-game-title"></h2>
            </div>
            <div class="iframe-container">
                <iframe id="main-frame" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
